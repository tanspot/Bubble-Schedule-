<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bubble Schedule</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #ffd9ec, transparent 35%),
        radial-gradient(circle at bottom right, #ccecff, transparent 35%),
        linear-gradient(135deg, #f9f1ff, #eaf8ff);
      color: #40384a;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .screen {
      min-height: 100vh;
    }

    /* LOGIN */

    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(15px);
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(100,80,120,.15);
      text-align: center;
    }

    .bubble-logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, white, transparent 20%),
        linear-gradient(145deg,#ffd3e8,#d8cff9,#c7edff);
      box-shadow:
        0 10px 30px rgba(150,120,180,.2),
        inset -10px -10px 20px rgba(255,255,255,.4);
      display: grid;
      place-items: center;
      font-size: 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      color: #5a4b68;
    }

    .subtitle {
      color: #8d8297;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
      color: #66586f;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      border: 1px solid #eadfec;
      background: white;
      padding: 14px;
      border-radius: 15px;
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #c9a7df;
      box-shadow: 0 0 0 3px rgba(201,167,223,.15);
    }

    .primary-button {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 17px;
      background: linear-gradient(135deg,#e7a9c8,#aeb2e8,#8fd1eb);
      color: white;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(150,120,180,.2);
    }

    .primary-button:active {
      transform: scale(.98);
    }

    .error {
      color: #b34c6f;
      margin-top: 15px;
      font-size: 14px;
      min-height: 18px;
    }

    /* APP */

    #app {
      display: none;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .topbar {
      padding: 22px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .small-bubble {
      width: 45px;
      height: 45px;
      border-radius: 16px;
      background: linear-gradient(145deg,#ffd3e8,#d8cff9,#c7edff);
      display: grid;
      place-items: center;
      font-size: 22px;
    }

    .brand strong {
      display: block;
      font-size: 18px;
      color: #55485f;
    }

    .brand span {
      font-size: 12px;
      color: #91879c;
    }

    .logout-button {
      border: 0;
      background: rgba(255,255,255,.75);
      color: #7c6d85;
      padding: 10px 14px;
      border-radius: 13px;
      font-weight: 700;
    }

    .container {
      width: calc(100% - 30px);
      max-width: 900px;
      margin: auto;
    }

    .hero {
      padding: 25px;
      border-radius: 28px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 15px 40px rgba(100,80,120,.1);
      margin-bottom: 20px;
    }

    .hero h2 {
      margin: 0 0 7px;
      font-size: 26px;
      color: #51455d;
    }

    .hero p {
      margin: 0;
      color: #91879c;
    }

    .role-pill {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 11px;
      border-radius: 20px;
      background: #f0e5fa;
      color: #806796;
      font-size: 12px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .section-title {
      margin: 25px 5px 12px;
      color: #66586f;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 15px;
    }

    .card {
      background: rgba(255,255,255,.82);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(100,80,120,.08);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 900;
      color: #63516e;
    }

    .stat-label {
      color: #93889d;
      font-size: 13px;
      margin-top: 4px;
    }

    .quick-button {
      width: 100%;
      border: 0;
      background: linear-gradient(135deg,#fff,#f6edff);
      border-radius: 20px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(100,80,120,.07);
    }

    .quick-button strong {
      display: block;
      color: #5d4d68;
      margin-bottom: 5px;
    }

    .quick-button span {
      color: #93889d;
      font-size: 13px;
    }

    /* TEAM */

    #teamScreen {
      display: none;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .team-header {
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-button {
      border: 0;
      background: rgba(255,255,255,.8);
      width: 42px;
      height: 42px;
      border-radius: 14px;
      font-size: 20px;
    }

    .team-header h2 {
      margin: 0;
      color: #55485f;
    }

    .team-count {
      color: #91879c;
      font-size: 13px;
      margin-top: 3px;
    }

    .add-button {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 17px;
      background: linear-gradient(135deg,#ffd2e7,#d7d1f8,#c6ebfa);
      color: #5d5067;
      font-weight: 800;
      margin-bottom: 15px;
    }

    #addTeamForm {
      display: none;
      margin-bottom: 20px;
    }

    .team-list {
      display: grid;
      gap: 14px;
    }

    .schedule-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .schedule-info strong {
      display: block;
      color: #5d5067;
      font-size: 17px;
    }

    .schedule-info span {
      display: block;
      margin-top: 4px;
      color: #958a9e;
      font-size: 13px;
      text-transform: capitalize;
    }

    #teamFormMessage {
      margin-top: 10px;
      font-size: 13px;
      color: #b34c6f;
      min-height: 18px;
    }

    @media (max-width: 500px) {

      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .hero h2 {
        font-size: 23px;
      }

    }

  </style>

</head>

<body>

  <!-- LOGIN SCREEN -->

  <div id="loginScreen" class="screen">

    <div class="login-card">

      <div class="bubble-logo">
        🫧
      </div>

      <h1>Bubble Schedule</h1>

      <div class="subtitle">
        Simple scheduling for your team
      </div>

      <form id="loginForm">

        <div class="input-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            required
          >

        </div>

        <div class="input-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Your password"
            required
          >

        </div>

        <button
          class="primary-button"
          type="submit"
        >
          Log In
        </button>

        <div
          id="loginError"
          class="error"
        ></div>

      </form>

    </div>

  </div>


  <!-- MAIN APP -->

  <div id="app">

    <div class="topbar">

      <div class="brand">

        <div class="small-bubble">
          🫧
        </div>

        <div>

          <strong>
            Bubble Schedule
          </strong>

          <span>
            Team scheduling
          </span>

        </div>

      </div>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Log Out
      </button>

    </div>


    <div class="container">

      <div class="hero">

        <h2 id="welcome">
          Welcome!
        </h2>

        <p>
          Keep your team organized and your schedule running smoothly.
        </p>

        <div
          id="roleDisplay"
          class="role-pill"
        >
        </div>

      </div>


      <div class="section-title">
        Overview
      </div>

      <div class="grid">

        <div class="card">

          <div
            class="stat-number"
            id="teamStat"
          >
            0
          </div>

          <div class="stat-label">
            Team Members
          </div>

        </div>

        <div class="card">

          <div
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            Scheduled Today
          </div>

        </div>

      </div>


      <div class="section-title">
        Quick Actions
      </div>

      <div class="grid">

        <button
          class="quick-button"
          type="button"
          id="teamNavButton"
        >

          <strong>
            👥 Manage Team
          </strong>

          <span>
            Add or remove employees
          </span>

        </button>


        <button
          class="quick-button"
          type="button"
        >

          <strong>
            📅 Schedule
          </strong>

          <span>
            Build your team's schedule
          </span>

        </button>

      </div>

    </div>

  </div>


  <!-- TEAM SCREEN -->

  <div id="teamScreen">

    <div class="team-header">

      <button
        id="teamBackButton"
        class="back-button"
        type="button"
      >
        ←
      </button>

      <div>

        <h2>
          Your Team
        </h2>

        <div
          id="teamCount"
          class="team-count"
        >
          0 members
        </div>

      </div>

    </div>


    <div class="container">

      <button
        id="showAddTeam"
        class="add-button"
        type="button"
      >
        + Add Team Member
      </button>


      <div
        id="addTeamForm"
        class="card"
      >

        <div class="input-group">

          <label for="newTeamName">
            Employee Name
          </label>

          <input
            id="newTeamName"
            type="text"
            placeholder="Employee name"
          >

        </div>


        <div class="input-group">

          <label for="newTeamRole">
            Role
          </label>

          <select id="newTeamRole">

            <option value="employee">
              Employee
            </option>

            <option value="manager">
              Manager
            </option>

          </select>

        </div>


        <button
          id="saveTeamMember"
          class="primary-button"
          type="button"
        >
          Save Team Member
        </button>

        <div id="teamFormMessage"></div>

      </div>


      <div
        id="teamList"
        class="team-list"
      >
        Loading your team...
      </div>

    </div>

  </div>


  <script>

    /* SUPABASE CONNECTION */

    const SUPABASE_URL =
      "https://sflhmsbqlrgkcukwcewj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_7iv8DqjXT_CG5M3zf8NY8g_ZvRW6NQ8";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* SCREEN ELEMENTS */

    const loginScreen =
      document.getElementById("loginScreen");

    const app =
      document.getElementById("app");

    const loginForm =
      document.getElementById("loginForm");

    const loginError =
      document.getElementById("loginError");


    /* LOGIN */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        loginError.textContent = "";

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          alert(
            "LOGIN ERROR: " +
            error.message
          );

          loginError.textContent =
            error.message;

          return;

        }


        alert("LOGIN SUCCESS!");


        await showApp(data.user);

      });


    /* SHOW APP */

    async function showApp(user) {

      loginScreen.style.display =
        "none";

      app.style.display =
        "block";


      const { data: profile, error } =
        await supabaseClient
          .from("profiles")
          .select("full_name, role")
          .eq("id", user.id)
          .single();


      if (error) {

        console.error(
          "PROFILE ERROR:",
          error
        );

        document.getElementById("welcome").textContent =
          "Welcome!";

        document.getElementById("roleDisplay").textContent =
          "";

        return;

      }


      if (profile) {

        document.getElementById("welcome").textContent =
          profile.full_name
            ? "Welcome, " +
              profile.full_name +
              "!"
            : "Welcome!";


        document.getElementById("roleDisplay").textContent =
          profile.role || "";

      }

    }


    /* LOGOUT */

    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        async function() {

          await supabaseClient.auth.signOut();

          app.style.display =
            "none";

          loginScreen.style.display =
            "flex";

        }
      );


    /* CHECK EXISTING SESSION */

    async function checkSession() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {

        await showApp(
          data.session.user
        );

      }

    }

    checkSession();


    /* OPEN TEAM */

    document
      .getElementById("teamNavButton")
      .addEventListener(
        "click",
        async function() {

          app.style.display =
            "none";

          document
            .getElementById("teamScreen")
            .style.display =
            "block";

          await loadTeam();

        }
      );


    /* BACK FROM TEAM */

    document
      .getElementById("teamBackButton")
      .addEventListener(
        "click",
        function() {

          document
            .getElementById("teamScreen")
            .style.display =
            "none";

          app.style.display =
            "block";

        }
      );


    /* SHOW ADD TEAM FORM */

    document
      .getElementById("showAddTeam")
      .addEventListener(
        "click",
        function() {

          const form =
            document.getElementById(
              "addTeamForm"
            );

          form.style.display =
            form.style.display === "none"
              ? "block"
              : "none";

        }
      );


    /* LOAD TEAM */

    async function loadTeam() {

      const list =
        document.getElementById(
          "teamList"
        );

      list.innerHTML =
        "Loading your team...";


      const { data, error } =
        await supabaseClient
          .from("team_members")
          .select(
            "id, full_name, role"
          )
          .order("full_name");


      if (error) {

        console.error(
          "TEAM ERROR:",
          error
        );

        list.innerHTML = `
          <div class="card">
            <strong>
              Unable to load team members.
            </strong>

            <p style="color:#91879c;">
              ${error.message}
            </p>
          </div>
        `;

        return;

      }


      document.getElementById(
        "teamCount"
      ).textContent =
        data.length +
        (
          data.length === 1
            ? " member"
            : " members"
        );


      document.getElementById(
        "teamStat"
      ).textContent =
        data.length;


      if (!data.length) {

        list.innerHTML = `
          <div class="card">

            <strong>
              No team members yet 🫧
            </strong>

            <p style="color:#91879c;">
              Add your first employee above.
            </p>

          </div>
        `;

        return;

      }


      list.innerHTML =
        data.map(
          member => `

            <div
              class="card"
              style="position:relative;"
            >

              <div class="schedule-row">

                <div
                  style="
                    width:54px;
                    height:54px;
                    border-radius:18px;
                    display:grid;
                    place-items:center;
                    background:
                      linear-gradient(
                        145deg,
                        #ffd6e9,
                        #d8cff9,
                        #c6eafa
                      );
                    font-size:25px;
                  "
                >
                  ${
                    member.role === "manager"
                      ? "👑"
                      : "🫧"
                  }
                </div>


                <div class="schedule-info">

                  <strong>
                    ${member.full_name}
                  </strong>

                  <span>
                    ${member.role}
                  </span>

                </div>

              </div>


              <div
                style="
                  display:flex;
                  gap:8px;
                  margin-top:15px;
                "
              >

                <button
                  type="button"
                  onclick="
                    removeTeamMember(
                      '${member.id}'
                    )
                  "
                  style="
                    flex:1;
                    border:0;
                    padding:11px;
                    border-radius:14px;
                    background:#f8dfe9;
                    color:#a45877;
                    font-weight:700;
                  "
                >
                  Remove
                </button>

              </div>

            </div>

          `
        ).join("");

    }


    /* ADD TEAM MEMBER */

    document
      .getElementById("saveTeamMember")
      .addEventListener(
        "click",
        async function() {

          const name =
            document
              .getElementById(
                "newTeamName"
              )
              .value
              .trim();


          const role =
            document
              .getElementById(
                "newTeamRole"
              )
              .value;


          const message =
            document.getElementById(
              "teamFormMessage"
            );


          message.textContent =
            "";


          if (!name) {

            message.textContent =
              "Please enter a name.";

            return;

          }


          const { error } =
            await supabaseClient
              .from("team_members")
              .insert({
                full_name: name,
                role: role
              });


          if (error) {

            message.textContent =
              error.message;

            return;

          }


          message.style.color =
            "#6d9b7c";

          message.textContent =
            name +
            " was added successfully! 🫧";


          document
            .getElementById(
              "newTeamName"
            )
            .value = "";


          await loadTeam();

        }
      );


    /* REMOVE TEAM MEMBER */

    async function removeTeamMember(id) {

      if (
        !confirm(
          "Remove this team member?"
        )
      ) {

        return;

      }


      const { error } =
        await supabaseClient
          .from("team_members")
          .delete()
          .eq("id", id);


      if (error) {

        alert(
          "REMOVE ERROR: " +
          error.message
        );

        return;

      }


      await loadTeam();

    }

  </script>

</body>
</html>
